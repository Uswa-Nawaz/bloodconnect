<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodConnect - Login</title>
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/forms.css">
    <script src="js/navbar.js" defer></script>
    <script src="js/login.js" defer></script>
</head>
<body>
    <div id="navbar-placeholder"></div>

        <div class="form-card">
        <h1>Login</h1>
        <form id="login-form" class="form-grid">
            <input type="email" name="email" placeholder="Email" required class="full-width">
            
            <div class="password-wrapper full-width">
                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                    id="login-password-field"
                >

                <span
                    class="toggle-password"
                    onclick="togglePassword('login-password-field', this)"
                >
                    Show
                </span>
            </div>

            <button type="submit" class="full-width">Login</button>
        </form>
        <p id="login-message"></p>

        <p class="switch-link">Don't have an account? <a href="register.html">Register here</a></p>
    </div>

</body>
</html>
